services:
  # MySQL 설정
  mysql:
    image: mysql:8.4
    container_name: my-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_USER: ${DB_USERNAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kok-network

  # Redis 설정
  redis:
    image: redis:7.0
    container_name: my-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kok-network

volumes:
  mysql_data:
  redis_data:

networks:
  kok-network:
    external: true
