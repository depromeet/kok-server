version: '3.8'

services:
  kok-dev:
    container_name: kok-dev
    image: ${DOCKERHUB_USERNAME}/kok-dev:${KOK_DEV_TAG}
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "80:8080"
    networks:
      - kok-network

networks:
  kok-network:
    driver: bridge
