events {
    worker_connections 1024;
}

http {
    upstream backend {
        server kok-blue:8080;
        # server kok-green:8080; ← 배포 스크립트에서 교체
    }

    server {
        listen 80;
        server_name prod-api.kokokok.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name prod-api.kokokok.com;

        ssl_certificate /etc/letsencrypt/live/prod-api.kokokok.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prod-api.kokokok.com/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
