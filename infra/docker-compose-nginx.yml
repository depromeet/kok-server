version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: kok-nginx
    restart: always
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot:/var/www/certbot
    networks:
      - kok-network

networks:
  kok-network:
    external: true

