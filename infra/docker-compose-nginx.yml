version: '3.8'

services:
  nginx:
    container_name: kok-nginx
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    env_file:
      - .env
    ports:
      - "8080:80"
    networks:
      - kok-network

networks:
  kok-network:
    external: true
