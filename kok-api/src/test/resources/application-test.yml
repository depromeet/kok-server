spring:
  profiles:
    active: test
  flyway:
    enabled: true
    connect-retries: 30
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.spatial.dialect.mysql.MySQLSpatialDialect
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
