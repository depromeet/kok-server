name: kok-TEST (on container env)

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  test:
    name: Test-Auth
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0
        container_name: my-redis
        ports:
          - "6379:6379"
        env:
          TZ: "Asia/Seoul"

      mysql:
        image: mysql:8.4
        ports:
          - "3306:3306"
        environment:
          MYSQL_ROOT_PASSWORD: ${{secrets.Test_PW}}
          MYSQL_DATABASE: ${{secrets.Test_DB}}
          MYSQL_ROOT_USER: ${{secrets.Test_User}}

steps:
  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v2
    with:
      distribution: 'zulu'
      java-version: '21'

  - name: Grant execute permission to gradlew
    run: chmod +x ./gradlew
    working-directory: ${{ env.working-directory }}

  - name: Test with gradle
    run: ./gradlew test
    working-directory: ${{ env.working-directory }}